apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-app
  namespace: <your-namespace>
spec:
  replicas: 1
  selector:
    matchLabels: { app: sandbox-app }
  template:
    metadata:
      labels: { app: sandbox-app }
    spec:
      containers:
        - name: sandbox-app
          image: <your-registry>/sandbox-app:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef:
                name: sandbox-app-config
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
